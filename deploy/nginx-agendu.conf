# nginx: recebe agendu.ativix.co e repassa para o gunicorn (127.0.0.1:8002).
# O certbot acrescenta o HTTPS (porta 443) aqui automaticamente. DOMINIO é trocado pelo instalar_servidor.sh.
# Não existe /media/ público: as fotos das clientes só saem pelo Django, com login.
server {
    listen 80;
    server_name DOMINIO;

    # várias fotos de celular de uma vez
    client_max_body_size 40m;

    location /static/ {
        alias /srv/agendu/dados/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
